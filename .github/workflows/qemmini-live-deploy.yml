name: Qemmini Live Deploy
# Manual-only deploy of the OLD Qemmini site (screenshot-exact-match main)
# to the live Worker `qemmini`. Created 2026-11-10 because the user has no
# repo checkout on his laptop and the browser has no terminal.
# Binding procedure (durable lesson): the build generates
# dist/server/wrangler.json from the ROOT wrangler.jsonc, so the config must
# be rebound to live BEFORE `npm run build`. Never --config wrangler-live.jsonc.
on:
  workflow_dispatch:

concurrency:
  group: qemmini-live-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The project installs with Bun (bun.lock is the lockfile; there is no
      # package-lock.json, so npm ci / setup-node npm cache cannot work).
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Phase 4: the take-writes Queue is gone (Durable Objects now hold
      # the live session). Only the D1 binding is rebound here. Today the
      # committed file already holds the live names (the rebind is then a
      # no-op safeguard); if the file is ever restored to staging names,
      # this step makes the deploy live.
      - name: Rebind wrangler config to live
        run: |
          node -e "
          const fs = require('fs');
          let s = fs.readFileSync('wrangler.jsonc', 'utf8');
          s = s.replace(/\"database_name\": \"qemmini-db\"/, '\"database_name\": \"qemmini-live-db\"');
          s = s.replace(/\"database_id\": \"382015c0-8484-4143-b2e3-7391b0fffb7d\"/, '\"database_id\": \"3d9fae1b-acb7-426c-a7ec-307217fab151\"');
          if (!s.includes('qemmini-live-db') || !s.includes('3d9fae1b-acb7-426c-a7ec-307217fab151')) throw new Error('live rebind failed');
          fs.writeFileSync('wrangler.jsonc', s);
          console.log('wrangler.jsonc rebound to qemmini-live-db');
          "
      - name: Read current live flags and preserve dashboard vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/qemmini/settings`, {
            headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},
          });
          if (!response.ok) throw new Error(`LIVE_SETTINGS_READ_FAILED_HTTP_${response.status}`);
          const payload = await response.json();
          if (!payload.success || !Array.isArray(payload.result?.bindings)) throw new Error('LIVE_SETTINGS_READ_INVALID');
          const bindings = payload.result.bindings;
          if (!bindings.some((b) => b.name === 'GRADE_PREVIEW_SIGNING_KEY' && b.type === 'secret_text')) {
            throw new Error('EXISTING_SIGNING_KEY_REQUIRED_NO_KEY_CHANGES_ALLOWED');
          }
          for (const name of ['AI_REQUESTS_ENABLED','AI_PROVIDER_DAILY_REQUEST_LIMIT','AI_ATTEMPT_LOG_ENABLED']) {
            const binding = bindings.find((b) => b.name === name);
            if (binding && (binding.type !== 'plain_text' || String(binding.text ?? '').trim() !== '')) {
              throw new Error('LIVE_AI_FLAG_ALREADY_CONFIGURED_REQUIRES_REVIEW');
            }
          }
          // Do not print, save or export returned bindings. Only compare the
          // existing committed plain vars to live; never overwrite drift.
          const path = 'wrangler.jsonc';
          let config = fs.readFileSync(path, 'utf8');
          const vars = config.match(/"vars"\s*:\s*\{([\s\S]*?)\}/)?.[1];
          if (!vars) throw new Error('CONFIG_VARS_NOT_FOUND');
          for (const [, name, value] of vars.matchAll(/"([^"\n]+)"\s*:\s*"([^"\n]*)"/g)) {
            const binding = bindings.find((b) => b.name === name);
            if (!binding || binding.type !== 'plain_text' || binding.text !== value) throw new Error('LIVE_CONFIG_DRIFT_REQUIRES_REVIEW');
          }
          // Wrangler preserves additional dashboard vars with keep_vars.
          // Secret bindings are retained by Wrangler, never read or copied.
          config = config.replace('"name": "qemmini",', '"name": "qemmini",\n  "keep_vars": true,');
          fs.writeFileSync(path, config);
          console.log('Live settings verified; AI flags unset; dashboard vars preserved.');
          NODE
      - run: npm run build
      - name: Confirm generated binding is live
        run: |
          # NOTE: the generated file is minified JSON — no space after
          # the colon, so the DO pattern must match \"name\":\"TAKE_SESSIONS\"
          # exactly (a spaced '\"name\": \"TAKE_SESSIONS\"' never matches).
          grep -q 'qemmini-live-db' dist/server/wrangler.json && grep -q '\"name\":\"TAKE_SESSIONS\"' dist/server/wrangler.json && echo "generated binding is live"
      # Phase 4: no queue-create step — the take-writes Queue is gone.
      # `wrangler deploy` applies the TakeSession DO migration (v1)
      # from wrangler.jsonc automatically.
      - name: Ensure dedicated paper preview signing key (preserve existing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-grade-preview-key.mjs qemmini
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name qemmini
      - name: Verify live site
        run: |
          curl -s https://qemmini.adhamelhansye.workers.dev | grep -q 'rel="manifest"' && echo "live manifest OK"
