name: Qemmini Live Deploy
# Manual-only deploy of the OLD Qemmini site (screenshot-exact-match main)
# to the live Worker `qemmini`. Created 2026-11-10 because the user has no
# repo checkout on his laptop and the browser has no terminal.
# Binding procedure (durable lesson): the build generates
# dist/server/wrangler.json from the ROOT wrangler.jsonc, so the config must
# be rebound to live BEFORE `npm run build`. Never --config wrangler-live.jsonc.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The project installs with Bun (bun.lock is the lockfile; there is no
      # package-lock.json, so npm ci / setup-node npm cache cannot work).
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Phase 3: the queue names are rebound the same way as the D1
      # binding. Today the committed file already holds the live names
      # (the rebind is then a no-op safeguard); if the file is ever
      # restored to staging names, this step makes the deploy live.
      # NOTE: the producer queue name appears twice (producer +
      # consumer), so its replace uses /g. The DLQ name appears once,
      # under "dead_letter_queue" — NOT under "queue".
      - name: Rebind wrangler config to live
        run: |
          node -e "
          const fs = require('fs');
          let s = fs.readFileSync('wrangler.jsonc', 'utf8');
          s = s.replace(/\"database_name\": \"qemmini-db\"/, '\"database_name\": \"qemmini-live-db\"');
          s = s.replace(/\"database_id\": \"382015c0-8484-4143-b2e3-7391b0fffb7d\"/, '\"database_id\": \"3d9fae1b-acb7-426c-a7ec-307217fab151\"');
          s = s.replace(/\"queue\": \"qemmini-take-writes-staging\"/g, '\"queue\": \"qemmini-take-writes\"');
          s = s.replace(/\"dead_letter_queue\": \"qemmini-take-writes-dlq-staging\"/g, '\"dead_letter_queue\": \"qemmini-take-writes-dlq\"');
          if (!s.includes('qemmini-live-db') || !s.includes('3d9fae1b-acb7-426c-a7ec-307217fab151')) throw new Error('live rebind failed');
          if (!s.includes('\"queue\": \"qemmini-take-writes\"') || !s.includes('\"dead_letter_queue\": \"qemmini-take-writes-dlq\"')) throw new Error('live queue rebind failed');
          fs.writeFileSync('wrangler.jsonc', s);
          console.log('wrangler.jsonc rebound to qemmini-live-db + qemmini-take-writes');
          "
      - run: npm run build
      - name: Confirm generated binding is live
        run: |
          # NOTE: the generated file is minified JSON — no space after
          # the colon, so the queue pattern must match "queue":"..."
          # exactly (a spaced '"queue": "qemmini-take-writes"' never
          # matches and failed run #5).
          grep -q 'qemmini-live-db' dist/server/wrangler.json && grep -q '"queue":"qemmini-take-writes"' dist/server/wrangler.json && echo "generated binding is live"
      # Phase 3: create the take-write queue + DLQ before deploy.
      # Wrangler auto-creates a missing queue named in the config at
      # deploy time, but an explicit create is the reliable path (and
      # makes a missing-queue failure visible here, not at deploy).
      # Idempotent: both commands tolerate "already exists".
      - name: Create take-write queues (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler queues create qemmini-take-writes-dlq || true
          npx wrangler queues create qemmini-take-writes || true
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name qemmini
      - name: Verify live site
        run: |
          curl -s https://qemmini.adhamelhansye.workers.dev | grep -q 'rel="manifest"' && echo "live manifest OK"
